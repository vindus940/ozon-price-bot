[package]
name = "ozon-price-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
eframe = "0.36"
futures-util = "0.3"
log = "0.4"
pretty_env_logger = "0.5"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teloxide = "0.17"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-tungstenite = "0.30"

[dev-dependencies]
# Только для тестов: разбор выдачи Ozon (parse.js) проверяется без браузера и сети.
boa_engine = "0.22"
