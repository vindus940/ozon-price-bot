name: Проверки

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Программа только для Windows: окно, браузер и автозапуск проверяются там, где работают.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -W clippy::pedantic -D warnings
      - run: cargo test
